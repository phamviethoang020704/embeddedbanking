name: Embedded Banking CI

on:
  push:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: EB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java version
        run: java -version

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and verify
        run: ./mvnw clean verify
      - name: Show build output
        run: ls -la target
      - name: Build Docker image
        run: docker build -t embedded-banking:latest .
      - name: Show Docker images
        run: docker images

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/embedded-banking:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/embedded-banking:latest