openapi: 3.0.3
info:
  title: Embedded Banking
  description: API for Embedded Banking
  version: 1.0.21212
  contact:
    name: MSB Develop team

servers:
  - url: http://localhost:9999/embedded-banking
    description: Local development server
tags:
  - name: Auth
    description: API xác thực và quản lí token
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập
      description: Xác thực người dùng và trả về JWT access token và refresh token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Có lỗi phía server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Làm mới token
      description: Làm mới access token bằng refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Làm mới token thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Có lỗi phía server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: tên đăng nhập
          example: "admin123"
          minLength: 8
          maxLength: 255
        password:
          type: string
          description: mật khẩu
          example: "123123123"
          minLength: 8
          maxLength: 255

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token để làm mới access token
          example: "adhnaiowndasodakpwekda..."

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "efsiawonasmmmoawwfhnas..."
        refreshToken:
          type: string
          description: Refresh token
          example: "eyjdcnapwmdaawonasdxmasld...."
        tokenType:
          type: string
          description: Loại token
          example: "Bearer"
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: Thời gian hết hạn của access token (giây)
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: Thời gian hết hạn của refresh token (giây)
          example: 604800
        user:
          $ref: '#/components/schemas/UserResponse'

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: Error code
          example: "DSS-xxx"
        message:
          type: string
          description: Error message
          example: "Error message"
        detail:
          type: string
          description: Detailed error description
          example: "Detailed error message"
        path:
          type: string
          description: Request path where error occurred
          example: "/v<version>/<resources>"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when error occurred
          example: "2024-11-26T10:00:00Z"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID người dùng
          example: 1
        username:
          type: string
          description: Tên đăng nhập
          example: nguyen.van.an
        email:
          type: string
          description: Email người dùng
          example: nguyen.van.an@example.com
        fullName:
          type: string
          description: Tên đầy đủ của người dùng
          example: Nguyễn Văn An


